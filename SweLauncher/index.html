<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweLauncher</title>
    <!-- Google Fonts ve FontAwesome İkonları -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Poppins', sans-serif;
        background: #0a0a0c;
        background-image: 
          radial-gradient(circle at 50% 30%, rgba(255, 0, 55, 0.15) 0%, transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(120, 0, 255, 0.1) 0%, transparent 50%);
        color: #ffffff;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
        z-index: 1;
      }

      /* ORTADAKİ ÖZEL VİTRİN KARTI */
      .hero-card-container {
        position: fixed;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 999;
        pointer-events: none; /* Launcher arayüzünü engellememesi için */
      }

      .hero-card-container * {
        pointer-events: auto;
      }

      .hero-frame {
        position: relative;
        width: 160px;
        height: 160px;
        border-radius: 20px;
        padding: 6px;
        /* Kırmızı Çerçeve ve Neon Işıma */
        background: linear-gradient(135deg, #ff0037, #ff5500, #ff0037);
        box-shadow: 
          0 0 20px rgba(255, 0, 55, 0.6),
          0 0 40px rgba(255, 0, 55, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .hero-frame:hover {
        transform: scale(1.05);
        box-shadow: 
          0 0 30px rgba(255, 0, 55, 0.9),
          0 0 60px rgba(255, 0, 55, 0.5);
      }

      /* #BEST Rozeti */
      .best-tag {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        background: #ff0037;
        color: #fff;
        font-weight: 900;
        font-size: 11px;
        padding: 3px 12px;
        border-radius: 20px;
        letter-spacing: 1.5px;
        box-shadow: 0 0 10px rgba(255, 0, 55, 0.8);
        border: 2px solid #0a0a0c;
      }

      /* Resim Kapsayıcısı */
      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 14px;
        display: block;
        background-color: #1a1a1e;
      }

      /* Alt Kısımdaki Sweza Yazısı */
      .hero-title {
        margin-top: 12px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffffff 0%, #ff4d6d 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
      }

      /* TELEGRAM BUTONLARI */
      .telegram-links {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 12px;
        z-index: 9999;
      }

      .tg-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(18, 18, 24, 0.7);
        backdrop-filter: blur(10px);
        color: #26a5e4;
        padding: 10px 16px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid rgba(38, 165, 228, 0.3);
        transition: all 0.25s ease;
      }

      .tg-btn:hover {
        background: #26a5e4;
        color: #ffffff;
        box-shadow: 0 0 20px rgba(38, 165, 228, 0.5);
        transform: translateY(-3px);
      }

      .tg-btn i {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ORTADAKİ FOTOĞRAF VE SWEZA ALANI -->
    <div class="hero-card-container">
      <div class="hero-frame">
        <span class="best-tag">#BEST</span>
        <!-- Buradaki src alanına kendi resminin yolunu veya URL'sini yazabilirsin -->
        <img class="hero-img" src="src/assets/hero.png" alt="Sweza" onerror="this.src='https://via.placeholder.com/150/ff0037/ffffff?text=Sweza'" />
      </div>
      <div class="hero-title">SWEZA</div>
    </div>

    <!-- TELEGRAM SOSYAL LINKLERI -->
    <div class="telegram-links">
      <a href="https://t.me/xSweza" target="_blank" class="tg-btn">
        <i class="fa-brands fa-telegram"></i> @xSweza
      </a>
      <a href="https://t.me/OriTeam" target="_blank" class="tg-btn">
        <i class="fa-brands fa-telegram"></i> @OriTeam
      </a>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
