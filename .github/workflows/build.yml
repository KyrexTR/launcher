name: Build Desktop App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets (Parcel)
      run: npx parcel build index.html src/main.ts --target electron --public-url . -d app/dist --bundle-node-modules --no-source-maps --no-cache

    - name: Build Executable (Electron)
      run: npx electron-builder --win --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SweLauncher-EXE
        path: |
          dist/
          app/dist/
